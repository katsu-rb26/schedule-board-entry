<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schedule Board</title>

<!-- iOS Safari「ホーム画面に追加」対応：このページ自体がトップレベルドキュメントとして
     Safariに読み込まれるため、GAS側（Index.html）では効かなかったこれらのタグが
     ここでは正しく機能する。GASのWebアプリはGoogleが用意する外側の枠（iframe構造）の
     中にコンテンツが表示される仕様のため、apple-touch-icon等がiframeの内側にしか
     存在せず、Safariが「ホーム画面に追加」時に見る最上位ドキュメントには反映されない -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schedule Board">
<!-- アイコンは「Schedule／Board」の2段テキストを、アプリのヘッダーと同じ配色
     （文字色：--text-primary / --accent、背景：--bg）でPNG画像化した静的ファイル。
     Google Drive等の外部アップロードは経由せず、このページと同じ場所に直接配置している。
     iOSはapple-touch-iconのdata:URI（Base64埋め込み）を正しく認識しないことがあるため、
     実ファイルパスを使う -->
<link rel="apple-touch-icon" sizes="120x120" href="icon-120.png">
<link rel="apple-touch-icon" sizes="152x152" href="icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">

<!-- Android／Chrome向け：Webアプリマニフェスト（同じicon-192/512.pngを192x192・512x512で
     追加生成し、manifest.jsonから参照している）。iOSのapple-touch-iconと同じ理由
     （GAS側のIndex.htmlはiframeの内側になり最上位ドキュメントに反映されない）で、
     こちらもこの入口ページ側に置く必要がある -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#C97A1E">

<style>
  :root { --bg: #FBF9F3; --accent: #C97A1E; --accent-text: #8A4F0E; --text-primary: #2B2416; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: var(--bg); overflow: hidden;
    font-family: "Zen Maru Gothic", "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  .splashScreen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 32px; padding: 24px;
  }
  .splashLogos { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .splashLogo {
    height: 24px; width: auto; opacity: 0;
    animation: splashIn 0.6s ease forwards; animation-delay: 0.05s;
  }
  .splashTitle {
    margin: 0; line-height: 1; display: flex; align-items: baseline; gap: 3px;
    font-size: 34px; font-weight: 800; letter-spacing: 0.5px;
    opacity: 0; animation: splashIn 0.6s ease forwards; animation-delay: 0.22s;
  }
  .splashTitleMain { color: var(--text-primary); }
  .splashTitleAccent { color: var(--accent); }
  @keyframes splashIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .openAppBtn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 14px 32px; border-radius: 10px; background: var(--accent); color: #fff;
    font-size: 16px; font-weight: 700; text-decoration: none;
    box-shadow: 0 4px 14px rgba(201,122,30,0.35);
    opacity: 0; animation: btnIn 0.6s ease forwards; animation-delay: 0.45s;
  }
  .openAppBtn:active { background: var(--accent-text); }
  @keyframes btnIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hint {
    font-size: 11.5px; color: #7A6B4A; text-align: center; max-width: 280px; line-height: 1.6;
    opacity: 0; animation: btnIn 0.6s ease forwards; animation-delay: 0.7s;
  }
  @media (prefers-reduced-motion: reduce) {
    .splashLogo, .splashTitle, .openAppBtn, .hint { animation: none; opacity: 1; }
  }
</style>
</head>

  <script>
